name: System regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix admin ci && npm --prefix admin run build
      - run: npm test
      - run: npx playwright-core install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run test:webkit
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build image from clean checkout
        run: docker compose build
      - name: Start container and verify persistence across restart
        shell: bash
        run: |
          set -euo pipefail
          export JWT_SECRET="$(openssl rand -hex 32)"
          docker compose up -d --no-build
          trap 'docker compose logs --tail 40; docker compose down' EXIT
          wait_for_server() {
            for attempt in {1..30}; do
              if curl --max-time 3 -fsS http://localhost:3000/api/v1/health | jq -e '.status == "ok"'; then return 0; fi
              sleep 1
            done
            docker compose ps -a
            return 1
          }
          wait_for_server
          curl -fsSL http://localhost:3000/admin/ | grep -q 'id="app"'
          curl -fsS http://localhost:3000/api/docs.json | jq -e '.paths["/file-repo/{filename}/stream"].get' >/dev/null
          token=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' http://localhost:3000/api/v1/auth/login | jq -er .data.token)
          device=$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"CI test screen"}' http://localhost:3000/api/v1/devices | jq -er .data.id)
          docker compose restart
          wait_for_server
          curl -fsS -H "Authorization: Bearer $token" "http://localhost:3000/api/v1/devices/$device" | jq -e '.data.name == "CI test screen"'
