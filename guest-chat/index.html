<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>和猪猪聊天 · 家庭助手</title><link rel="stylesheet" href="/pig-chat/assets/chat.css"></head>
<body><main>
<header><span class="portrait" aria-hidden="true">🐷</span><div><small>家庭助手</small><h1>和猪猪聊天</h1></div></header>
<p class="notice">你可以查看、修改或取消在这段聊天中创建的提醒和信息，例如“明早去机场的提醒推迟半小时”。管理员会留存消息、回复、系统操作、会话和来源 IP。对话会交给家庭配置的模型。</p>
<label class="nickname">如何称呼你？<input id="nickname" maxlength="32" placeholder="选填，默认以访客身份聊天"></label>
<section id="history" aria-label="聊天记录" aria-live="polite"></section>
<form id="composer"><label for="message">发给猪猪</label><textarea id="message" maxlength="1600" rows="3" placeholder="例如：下个月 12 日我们坐 MU5123 去上海。"></textarea>
<div class="actions"><span id="status" role="status">正在连接家庭助手…</span><button id="send" disabled>发送</button></div></form>
</main><script src="/pig-chat/assets/chat.js" defer></script></body></html>
