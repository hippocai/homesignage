<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 猪猪伙伴</title><link rel="stylesheet" href="/pig-chat/assets/chat.css"></head>
<body><main>
<header><span class="portrait" aria-hidden="true">🐷</span><div><small>家庭助手</small><h1>登录猪猪伙伴</h1></div></header>
<p class="notice">当前通过非家庭局域网入口访问，请使用 HomeSignage 系统账号登录后聊天。</p>
<form id="login" class="login-form">
<label for="username">用户名</label><input id="username" autocomplete="username" maxlength="128" required>
<label for="password">密码</label><input id="password" type="password" autocomplete="current-password" maxlength="1024" required>
<p id="status" role="status"></p><button id="submit">登录并聊天</button>
</form></main><script src="/pig-chat/assets/login.js" defer></script></body></html>
