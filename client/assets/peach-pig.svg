<style>
 #wrap,#snow,#notice{opacity:0}#scarf:target~#figure #wrap,#scarf:target~#snow,#serious:target~#notice{opacity:1}
 #wave:target~#figure #hand,#point:target~#figure #hand{transform-origin:166px 151px;animation:wave .8s ease-in-out infinite alternate}
 #figure{transform-origin:120px 200px;animation:breathe 3s ease-in-out infinite}
 @keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(-43deg)}}@keyframes breathe{50%{transform:translateY(-2px) rotate(-1deg)}}
 @media(prefers-reduced-motion:reduce){#figure,#figure #hand{animation:none!important}}
</style>
